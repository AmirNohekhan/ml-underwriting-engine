[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-underwriting-engine"
version = "0.1.0"
description = "Synthetic end-to-end ML underwriting and risk decision engine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Portfolio Project"}]
dependencies = [
    "fastapi>=0.111",
    "joblib>=1.3",
    "mlflow>=2.12",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.6",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "shap>=0.44",
    "uvicorn[standard]>=0.29",
    "xgboost>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
underwriting-engine = "underwriting_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
